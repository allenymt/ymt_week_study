android.useAndroidX=true
android.enableJetifier=true
# Robolectric 4.8.1 依赖 org.bouncycastle:bcprov-jdk15on:1.68，是个 multi-release jar，
# 里面的 META-INF/versions/15/*.class 是 class major 59。Jetifier 处理不了 59 及以上的字节码，
# 会在 JetifyTransform 阶段直接抛 "Unsupported class file major version 59" 让单测编译失败。
# bcprov 不是 Android 库，根本不需要 jetify，按文件名排除即可（AGP 4.1.3 的 experimental 选项）。
android.jetifier.blacklist=bcprov-jdk15on.*\\.jar
org.gradle.jvmargs=-Xmx1536m
# AGP 4.1.3 的 manifest merger 依赖老版 Gson，在 JDK 16+ 的强封装下会因无法反射
# java.io.File.path 而失败（module java.base does not "opens java.io"）。
# 固定用 JDK 11 构建，避免误取到 JAVA_HOME 指向的更高版本。
org.gradle.java.home=/Users/yulun/Library/Java/JavaVirtualMachines/ms-11.0.31/Contents/Home
